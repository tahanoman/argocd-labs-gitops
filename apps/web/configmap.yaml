apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content
  labels:
    app: web-demo
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Argo CD Web Demo</title>
      </head>
      <body>
        <h1>Hello from GitOps</h1>
        <p>Application: web-demo</p>
        <p>Release: v2</p>
        <p>This page is deployed from Git by Argo CD.</p>
      </body>
    </html>
