apiVersion: batch/v1
kind: Job
metadata:
  name: web-demo-wave-check
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: wave-check
          image: nginx:1.30.6-alpine3.24@sha256:583b7f2fce1cdb8da5ad5c39ebd3c33b98b87d493190e548bdee1fa8c619c311
          command: ["/bin/sh", "-ec"]
          args:
            - |
              release="$(cat /wave/release)"
              test "$release" = v2
              echo "Sync wave -1: ConfigMap release=$release"
              sleep 45
              echo "Sync wave -1 passed"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: release
              mountPath: /wave
              readOnly: true
      volumes:
        - name: release
          configMap:
            name: web-content
            items:
              - key: release
                path: release
