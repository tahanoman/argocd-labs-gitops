apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: gitops-envs
  namespace: argocd
spec:
  description: Web demo environments on the lab cluster
  sourceRepos:
    - "https://github.com/tahanoman/argocd-labs-gitops.git"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: dev
    - server: https://kubernetes.default.svc
      namespace: staging
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: Pod
    - group: apps
      kind: Deployment
    - group: apps
      kind: ReplicaSet
